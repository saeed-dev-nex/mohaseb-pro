# Render Blueprint — one free web service running the whole app
# (API + chat WebSocket + frontend + media) from the root Dockerfile.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mohaseb-pro
    runtime: docker
    branch: beta
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
