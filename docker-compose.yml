# Mohaseb Pro — one-command run:  docker compose up --build
#
# Before the first run, create a `.env` file in this folder (see .env.example)
# with at least a DJANGO_SECRET_KEY. The app is then available at
# http://localhost:8080 and the API also directly at http://localhost:8000/api/
# The first admin password is printed once in `docker compose logs backend`.

services:
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_MEDIA_ROOT: /data/media
    volumes:
      - mohaseb_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    volumes:
      # Read-only: nginx serves uploaded media straight from the data volume.
      - mohaseb_data:/data:ro
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mohaseb_data:
