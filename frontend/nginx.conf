server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match Django's DATA_UPLOAD_MAX_MEMORY_SIZE so document uploads pass.
    client_max_body_size 260m;

    # SPA shell + static assets (including the self-hosted Vazirmatn fonts)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files live on the shared data volume (read-only here)
    location /media/ {
        alias /data/media/;
        try_files $uri =404;
    }

    # Live chat WebSocket (backend ASGI route: ws/chat/)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The PWA service worker must never be cached by proxies
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
