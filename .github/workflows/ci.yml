name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Deployment check (warnings are informational)
        continue-on-error: true
        run: python manage.py check --deploy

      - name: Dependency audit (informational)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r requirements.txt

      - name: Verify migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  backend-windows:
    name: Backend smoke check (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "true"
      AUTOBAHN_USE_NVX: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,css}" "tests/**/*.mjs" "build/**/*.js" "vite.config.js"

      - name: Test
        run: npm test

      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
